<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Responsive Image Gallery</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>Explore Gallery</h1><p>Responsive gallery with categories and lightbox navigation.</p></header>
<section class="filters" aria-label="Gallery filters">
<button class="active" data-filter="all">All</button><button data-filter="nature">Nature</button><button data-filter="city">City</button><button data-filter="travel">Travel</button>
</section>
<main class="gallery" id="gallery"></main>
<div class="lightbox" id="lightbox" aria-hidden="true">
<button class="close" id="close">×</button><button class="nav prev" id="prev">‹</button>
<div class="lightbox-content"><img id="lightboxImage" alt=""><div id="caption"></div></div>
<button class="nav next" id="next">›</button>
</div>
<script src="script.js"></script>
</body>
</html>
